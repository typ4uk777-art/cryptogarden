<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крипто-Сад</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #181818;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header { text-align: center; margin-top: 20px; }
        .balance-title { font-size: 14px; color: #aaaaaa; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 32px; font-weight: bold; margin-top: 5px; color: #2f80ed; }
        .garden-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        
        .crypto-tree {
            max-width: 80%;
            max-height: 45vh;
            object-fit: contain;
            transform-origin: bottom center;
            animation: gentle-breeze 4s ease-in-out infinite alternate;
        }
        @keyframes gentle-breeze {
            0% { transform: rotate(-1.5deg) skewX(-0.5deg); }
            100% { transform: rotate(1.5deg) skewX(0.5deg); }
        }

        .controls-panel { width: 90%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .btn { background-color: #242424; border: 1px solid #333333; color: #ffffff; padding: 15px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: background-color 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.96); background-color: #2d2d2d; }
        .btn-water { background: linear-gradient(135deg, #2f80ed, #0056b3); border: none; }
        .btn-water:active { background: linear-gradient(135deg, #1e6bd6, #004494); }
        .btn-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <!-- Показываем ID дерева, чтобы заложить Сад из множества растений -->
        <div class="balance-title" id="tree-title">Дерево #1 — Заначка</div>
        <div class="balance-value" id="balance-display">Загрузка...</div>
    </div>

    <div class="garden-container">
        <img src="tree1.png" alt="Денежное Дерево" class="crypto-tree" id="tree-image">
    </div>

    <div class="controls-panel">
        <button class="btn btn-water" onclick="waterTree()">
            <span class="btn-icon">💧</span>
            <span>Полить заначку</span>
        </button>
        <button class="btn" onclick="harvestTree()">
            <span class="btn-icon">🪓</span>
            <span>Снять урожай</span>
        </button>
        <button class="btn" onclick="giftTree()">
            <span class="btn-icon">🎁</span>
            <span>Подарить дерево</span>
        </button>
        <button class="btn" onclick="openFriendGarden()">
            <span class="btn-icon">🏡</span>
            <span>Мой Сад</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { try { tg.expand(); } catch(e) {} }

        const urlParams = new URLSearchParams(window.location.search);
        
        // 🆔 Считываем ID дерева (по умолчанию #1)
        let treeId = urlParams.get('tree_id') || '1';
        document.getElementById('tree-title').innerText = "Дерево #" + treeId + " — Заначка";

        // Считываем баланс
        let rawBalance = urlParams.get('Balance') || urlParams.get('balance');
        let currentBalance = parseFloat(rawBalance);
        if (isNaN(currentBalance)) { currentBalance = 0; }
        
        // Считываем статус (growing / closed / harvested)
        let treeStatus = urlParams.get('Status') || urlParams.get('status') || 'growing';

        // Отображаем мультивалютный баланс
        document.getElementById('balance-display').innerText = currentBalance.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // 🌳 Динамическая графика по твоей задумке
        function updateTreeVisual(balance, status) {
            const treeImg = document.getElementById('tree-image');
            
            if (status === 'closed') {
                treeImg.src = "tree3.png"; // Стадия 3: Залочено / Расцвело
            } else if (status === 'harvested') {
                treeImg.src = "tree4.png"; // Стадия 4: Снятие урожая
            } else {
                if (balance === 0) {
                    treeImg.src = "tree1.png"; // Стадия 1: Росток
                } else {
                    treeImg.src = "tree2.png"; // Стадия 2: Кустик (безлимитный сбор)
                }
            }
        }

        updateTreeVisual(currentBalance, treeStatus);

        function waterTree() {
            if (treeStatus === 'closed' || treeStatus === 'harvested') {
                alert("Это дерево зафиксировано. Пополнить его нельзя!");
                return;
            }
            
            let deposit = 10;
            let netAmount = deposit * 0.99; // 1% комиссия на входе
            
            currentBalance += netAmount;
            document.getElementById('balance-display').innerText = currentBalance.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            updateTreeVisual(currentBalance, treeStatus);
            
            if (tg && tg.sendData) {
                tg.sendData("water_" + treeId + "_" + currentBalance.toFixed(2));
                setTimeout(() => { tg.close(); }, 500);
            } else {
                alert("Имитация полива дерева #" + treeId);
            }
        }

        function harvestTree() {
            alert("Для обналички или фиксации введите секретное слово в диалоге с ботом!");
            if (tg && tg.sendData) {
                tg.sendData("trigger_lock_" + treeId);
                setTimeout(() => { tg.close(); }, 500);
            }
        }

        function giftTree() {
            // 🎁 Проверка: дарить можно ТОЛЬКО залоченное (цветущее) дерево!
            if (treeStatus !== 'closed') {
                alert("Подарить можно только зафиксированное дерево! Сначала залочьте заначку (Стадия 3), придумав секретное слово.");
                return;
            }
            
            alert("Переключаем бота в режим создания подарочной ссылки...");
            if (tg && tg.sendData) {
                tg.sendData("trigger_gift_" + treeId);
                setTimeout(() => { tg.close(); }, 500);
            }
        }

        function openFriendGarden() {
            alert("Открываем меню вашего Сада для переключения между деревьями...");
            if (tg && tg.sendData) {
                tg.sendData("trigger_menu");
                setTimeout(() => { tg.close(); }, 500);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крипто-Сад</title>
    <!-- Подключаем официальный скрипт Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #181818;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header { text-align: center; margin-top: 20px; }
        .balance-title { font-size: 14px; color: #aaaaaa; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 32px; font-weight: bold; margin-top: 5px; color: #2f80ed; }
        .garden-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        
        /* Эффект ветра */
        .crypto-tree {
            max-width: 80%;
            max-height: 45vh;
            object-fit: contain;
            transform-origin: bottom center;
            animation: gentle-breeze 4s ease-in-out infinite alternate;
        }
        @keyframes gentle-breeze {
            0% { transform: rotate(-1.5deg) skewX(-0.5deg); }
            100% { transform: rotate(1.5deg) skewX(0.5deg); }
        }

        .controls-panel { width: 90%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .btn { background-color: #242424; border: 1px solid #333333; color: #ffffff; padding: 15px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: background-color 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.96); background-color: #2d2d2d; }
        .btn-water { background: linear-gradient(135deg, #2f80ed, #0056b3); border: none; }
        .btn-water:active { background: linear-gradient(135deg, #1e6bd6, #004494); }
        .btn-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-title">Моя Заначка</div>
        <div class="balance-value" id="balance-display">Загрузка...</div>
    </div>

    <div class="garden-container">
        <img src="tree4.png" alt="Денежное Дерево" class="crypto-tree" id="tree-image">
    </div>

    <div class="controls-panel">
        <button class="btn btn-water" onclick="waterTree()">
            <span class="btn-icon">💧</span>
            <span>Полить заначку</span>
        </button>
        <button class="btn" onclick="harvestTree()">
            <span class="btn-icon">🪓</span>
            <span>Снять урожай</span>
        </button>
        <button class="btn" onclick="giftTree()">
            <span class="btn-icon">🎁</span>
            <span>Подарить росток</span>
        </button>
        <button class="btn" onclick="openFriendGarden()">
            <span class="btn-icon">🏡</span>
            <span>Сад друзей</span>
        </button>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем шторку на максимум сразу

        // «Всеядное» чтение баланса из ссылки (ловит и Balance, и balance)
        const urlParams = new URLSearchParams(window.location.search);
        let rawBalance = urlParams.get('Balance') || urlParams.get('balance');
        let currentBalance = parseFloat(rawBalance);

        // Железобетонная защита: если в ссылке пустота, ставим чистый ноль
        if (isNaN(currentBalance)) {
            currentBalance = 0;
        }
        
        // Выводим баланс на экран
        document.getElementById('balance-display').innerText = currentBalance.toFixed(2) + " TON";

        function waterTree() {
            let deposit = 10;
            let netAmount = deposit * 0.99; // 1% садовнику на входе
            
            currentBalance += netAmount;
            document.getElementById('balance-display').innerText = currentBalance.toFixed(2) + " TON";
            
            // Отправляем боту простое число
            tg.sendData(currentBalance.toFixed(2)); 
            
            setTimeout(() => { tg.close(); }, 500);
        }

        function harvestTree() {
            if(currentBalance > 0) {
                alert("Урожай собран! Вы забираете ровно: " + currentBalance.toFixed(2) + " TON. Садовник уже позаботился о комиссии на входе! 😉");
                currentBalance = 0;
                document.getElementById('balance-display').innerText = currentBalance.toFixed(2) + " TON";
                
                tg.sendData("0");
                setTimeout(() => { tg.close(); }, 500);
            } else {
                alert("Дерево пока пустое. Полейте его!");
            }
        }

        function giftTree() { alert("Экран подарка в разработке"); }
        function openFriendGarden() { alert("Сад друзей в разработке"); }
    </script>
</body>
</html>

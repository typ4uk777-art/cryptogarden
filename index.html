<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крипто-Сад</title>
    <style>
        /* Стиль под темную тему Телеграма */
        body {
            margin: 0;
            padding: 0;
            background-color: #181818;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка с балансом */
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .balance-title {
            font-size: 14px;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
            color: #2f80ed; /* Синий цвет TON */
        }

        /* Контейнер для дерева */
        .garden-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* 🌳 ЭФФЕКТ ВЕТРА: Плавное покачивание дерева */
        .crypto-tree {
            max-width: 80%;
            max-height: 45vh;
            object-fit: contain;
            transform-origin: bottom center; /* Покачивание идет от корня/горшка */
            animation: gentle-breeze 4s ease-in-out infinite alternate;
        }

        @keyframes gentle-breeze {
            0% {
                transform: rotate(-1.5deg) skewX(-0.5deg);
            }
            100% {
                transform: rotate(1.5deg) skewX(0.5deg);
            }
        }

        /* Панель с 4 кнопками управления */
        .controls-panel {
            width: 90%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #242424;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #2d2d2d;
        }

        /* Выделяем главную коммерческую кнопку полива */
        .btn-water {
            background: linear-gradient(135deg, #2f80ed, #0056b3);
            border: none;
        }
        .btn-water:active {
            background: linear-gradient(135deg, #1e6bd6, #004494);
        }

        .btn-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <div class="balance-title">Моя Заначка</div>
        <div class="balance-value" id="balance-display">0 TON</div>
    </div>

    <!-- Витрина с анимированным деревом -->
    <div class="garden-container">
        <!-- Временно ставим картинку твоей финальной 4 стадии, переименуй свой файл в tree4.png -->
        <img src="tree4.png" alt="Денежное Дерево" class="crypto-tree" id="tree-image">
    </div>

    <!-- 4 Главные кнопки интерфейса -->
    <div class="controls-panel">
        <button class="btn btn-water" onclick="waterTree()">
            <span class="btn-icon">💧</span>
            <span>Полить заначку</span>
        </button>
        <button class="btn" onclick="harvestTree()">
            <span class="btn-icon">🪓</span>
            <span>Снять урожай (1%)</span>
        </button>
        <button class="btn" onclick="giftTree()">
            <span class="btn-icon">🎁</span>
            <span>Подарить росток</span>
        </button>
        <button class="btn" onclick="openFriendGarden()">
            <span class="btn-icon">🏡</span>
            <span>Сад друзей</span>
        </button>
    </div>

    <script>
        // Простая симуляция логики кликера для теста на первое время
        let currentBalance = 0;

        function waterTree() {
            currentBalance += 5;
            document.getElementById('balance-display').innerText = currentBalance + " TON";
            
            // Логика: если баланс растет, мы в будущем будем менять картинку src на tree1.png, tree3.png и т.д.
            // Сейчас у нас сразу красуется крутое финальное дерево
        }

        function harvestTree() {
            if(currentBalance > 0) {
                alert("Урожай собран! Оправлено на ваш кошелек: " + (currentBalance * 0.99).toFixed(2) + " TON (Удержана комиссия садовника 1%)");
                currentBalance = 0;
                document.getElementById('balance-display').innerText = currentBalance + " TON";
            } else {
                alert("Дерево пока не принесло плодов. Полейте его!");
            }
        }

        function giftTree() {
            alert("Экран создания подарка: выберите друга и введите секретное слово (в разработке)");
        }

        function openFriendGarden() {
            alert("Переход в Сад Друзей: здесь будут отображаться деревья, которые вы подарили (в разработке)");
        }
    </script>
</body>
</html>

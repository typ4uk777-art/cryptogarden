<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крипто-Сад</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #181818;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header { text-align: center; margin-top: 20px; width: 100%; }
        .balance-title { font-size: 14px; color: #aaaaaa; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 32px; font-weight: bold; margin-top: 5px; color: #2f80ed; }
        
        /* Плашка наследника */
        .heir-badge {
            background-color: #242424;
            border: 1px dashed #ffc107;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            color: #ffc107;
        }

        .garden-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        
        .crypto-tree {
            max-width: 80%;
            max-height: 42vh;
            object-fit: contain;
            transform-origin: bottom center;
            animation: gentle-breeze 4s ease-in-out infinite alternate;
        }
        @keyframes gentle-breeze {
            0% { transform: rotate(-1.5deg) skewX(-0.5deg); }
            100% { transform: rotate(1.5deg) skewX(0.5deg); }
        }

        .controls-panel { width: 90%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .btn { background-color: #242424; border: 1px solid #333333; color: #ffffff; padding: 14px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: background-color 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.96); background-color: #2d2d2d; }
        .btn-water { background: linear-gradient(135deg, #2f80ed, #0056b3); border: none; grid-column: span 2; padding: 16px; font-size: 15px; }
        .btn-water:active { background: linear-gradient(135deg, #1e6bd6, #004494); }
        .btn-icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-title" id="tree-title">Заначка — Обычное дерево</div>
        <div class="balance-value" id="balance-display">0.00</div>
        <div id="heir-container"></div>
    </div>

    <div class="garden-container">
        <img src="tree1.png" alt="Денежное Дерево" class="crypto-tree" id="tree-image">
    </div>

    <div class="controls-panel">
        <button class="btn btn-water" onclick="waterTree()">
            <span class="btn-icon">💧</span>
            <span>Полить заначку</span>
        </button>
        <button class="btn" onclick="harvestTree()">
            <span class="btn-icon">🪓</span>
            <span>Снять урожай</span>
        </button>
        <button class="btn" onclick="changeTreeStyle()">
            <span class="btn-icon">🎭</span>
            <span>Сменить скин</span>
        </button>
        <button class="btn" onclick="toggleInheritance()">
            <span class="btn-icon">📜</span>
            <span id="inherit-btn-text">Сделать наследством</span>
        </button>
        <button class="btn" onclick="openFriendGarden()">
            <span class="btn-icon">🏡</span>
            <span>Мой Сад</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { try { tg.expand(); } catch(e) {} }

        // Загрузка состояния
        let savedBalance = localStorage.getItem('crypto_garden_balance');
        let currentBalance = savedBalance ? parseFloat(savedBalance) : 0;
        if (isNaN(currentBalance)) { currentBalance = 0; }
        
        let treeStatus = localStorage.getItem('crypto_garden_status') || 'growing';
        let treeStyle = localStorage.getItem('crypto_garden_style') || 'classic';
        
        // Переменные для механики наследства
        let isInheritance = localStorage.getItem('crypto_garden_is_inherit') === 'true';
        let heirContact = localStorage.getItem('crypto_garden_heir') || '';

        // Инициализация интерфейса
        document.getElementById('balance-display').innerText = currentBalance.toFixed(2);
        updateTitle();
        updateHeirBadge();
        updateTreeVisual(currentBalance, treeStatus, treeStyle);

        function updateTitle() {
            let styleNames = { 
                'classic': 'Обычное дерево', 
                'cyberpunk': 'Киберпанк 🤖', 
                'christmas': 'Рождественское 🎄', 
                'palm': 'Пальма 🌴',
                'gold': 'Золотое (Спасибо! ❤️)' 
            };
            let prefix = isInheritance ? "📜 НАБЛЮДАЕМОЕ НАСЛЕДСТВО — " : "Заначка — ";
            document.getElementById('tree-title').innerText = prefix + (styleNames[treeStyle] || 'Обычное дерево');
            document.getElementById('inherit-btn-text').innerText = isInheritance ? "Убрать наследство" : "Сделать наследством";
        }

        function updateHeirBadge() {
            const container = document.getElementById('heir-container');
            if (isInheritance && heirContact) {
                container.innerHTML = `<div class="heir-badge">⭐ Наследник: ${heirContact}</div>`;
            } else if (isInheritance) {
                container.innerHTML = `<div class="heir-badge" style="border-color: #ff4d4d; color: #ff4d4d;" onclick="setupHeir()">⚠️ Нажмите, чтобы указать близкого</div>`;
            } else {
                container.innerHTML = '';
            }
        }

        function updateTreeVisual(balance, status, style) {
            const treeImg = document.getElementById('tree-image');
            if (!treeImg) return;
            
            if (status === 'harvested') {
                treeImg.src = "tree4.png"; 
                return;
            }

            let suffix = style === 'classic' ? '' : '_' + style;
            
            let stage = 1; 
            if (balance > 0 && balance <= 50) {
                stage = 1; 
            } else if (balance > 50 && balance <= 200) {
                stage = 2; 
            } else if (balance > 200) {
                stage = 3; 
            }

            treeImg.src = "tree" + stage + suffix + ".png";
        }

        function changeTreeStyle() {
            let styles = ['classic', 'cyberpunk', 'christmas', 'palm', 'gold'];
            let currentIndex = styles.indexOf(treeStyle);
            let nextIndex = (currentIndex + 1) % styles.length;
            treeStyle = styles[nextIndex];
            
            localStorage.setItem('crypto_garden_style', treeStyle);
            updateTitle();
            updateTreeVisual(currentBalance, treeStatus, treeStyle);
        }

        // Включение/выключение режима наследства
        function toggleInheritance() {
            isInheritance = !isInheritance;
            localStorage.setItem('crypto_garden_is_inherit', isInheritance);
            
            if (isInheritance && !heirContact) {
                setupHeir();
            }
            
            updateTitle();
            updateHeirBadge();
        }

        // Привязка близкого человека
        function setupHeir() {
            let contact = prompt("Укажите Telegram @username или имя близкого человека для подтверждения:");
            if (contact) {
                heirContact = contact;
                localStorage.setItem('crypto_garden_heir', heirContact);
            }
            updateHeirBadge();
        }

        function waterTree() {
            if (treeStatus === 'harvested') {
                alert("Урожай собран. Посадите новое дерево!");
                return;
            }
            
            let deposit = 10;
            let feePercent = (treeStyle === 'gold') ? 0.02 : 0.01;
            let netAmount = deposit * (1 - feePercent);
            
            currentBalance += netAmount;
            treeStatus = 'growing'; 
            
            document.getElementById('balance-display').innerText = currentBalance.toFixed(2);
            localStorage.setItem('crypto_garden_balance', currentBalance.toFixed(2));
            localStorage.setItem('crypto_garden_status', treeStatus);
            
            updateTreeVisual(currentBalance, treeStatus, treeStyle);
        }

        function harvestTree() {
            if (currentBalance === 0) {
                alert("Дерево пока пустое. Полейте его!");
                return;
            }

            // Если включен режим наследства — добавляем двухфакторную проверку наследника
            if (isInheritance && heirContact) {
                let confirmHeir = confirm(`Это дерево является Наследством. Будет отправлен запрос контакту ${heirContact}. Наследник подтверждает снятие?`);
                if (!confirmHeir) {
                    alert("Снятие отменено. Наследник не выдал подтверждение.");
                    return;
                }
            }

            let password = prompt("Введите секретное кодовое слово из завещания:");
            if (password) {
                alert("Доступ разрешен! Наследство выдано. Сумма: " + currentBalance.toFixed(2));
                currentBalance = 0;
                treeStatus = 'harvested';
                
                document.getElementById('balance-display').innerText = currentBalance.toFixed(2);
